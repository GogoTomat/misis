services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=10"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin"]
      interval: 2s
      timeout: 3s
      retries: 30
